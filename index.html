<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L-O HR System</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>body{margin:0;background:#F3F2F4;font:14px Tahoma,sans-serif;color:#1F1B22}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;gap:10px;padding:20px}.sp{width:28px;height:28px;border-radius:50%;border:3px solid #ddd;border-top-color:#E15532;animation:r 1s linear infinite;margin:auto}@keyframes r{to{transform:rotate(360deg)}}</style>
<script>(function(){try{var s=localStorage.getItem('lo-skin'),t=localStorage.getItem('lo-theme');if(s)document.documentElement.dataset.skin=s;document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}})();</script>
</head>
<body>
<div id="app"><div class="boot"><div><div class="sp"></div><p>شركة الليث العبيدي — نظام الأوصاف الوظيفية وتقييم الأداء</p></div></div></div>
<div id="printArea"></div>
<script src="config.js"></script>
<script src="app.js?v=2.1"></script>
</body>
</html>
